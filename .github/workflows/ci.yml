name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  checks:
    name: Guard + Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Guard migrations
        run: npm run guard:migrations

      - name: Typecheck
        run: npm run typecheck